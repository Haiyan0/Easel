# Task A4：完整 Desktop 开发编排（control + 受控出口代理）。
#
# worker/gateway 仍由 WSL2 宿主 provisioner 按 workspace 动态创建；本文件
# 不发布 worker/gateway 端口，不挂 Docker socket，不挂用户 workspace。
# 初始化/启动/诊断请使用 deploy/desktop 下的 Workspace PowerShell 入口。
#
# 手工检查：
#   docker compose -p <project> -f deploy/desktop/compose.workspace.yaml config --quiet

name: ${EASEL_DESKTOP_PROJECT:?请设置专用 Compose 项目名}

services:
  control:
    image: ${EASEL_CONTROL_IMAGE:?请设置固定 control 镜像 ID}
    pull_policy: never
    user: "10001:10001"
    group_add:
      - "${EASEL_PROVISIONER_GID:-1000}"
    init: true
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
    command:
      - python
      - -m
      - easel
      - serve-control
      - --control-dir
      - /srv/easel/control
      - --public-origin
      - ${EASEL_PUBLIC_ORIGIN:?请设置 ngrok HTTPS Origin}
      - --master-key-file
      - /keys/master.key
      - --snapshot-key-file
      - /keys/snapshot.pem
      - --managed-agent-config
      - /keys/managed-agent.json
      - --frontend-dir
      - /opt/easel/web/frontend/dist
      - --host
      - 0.0.0.0
      - --port
      - "7861"
      - --provisioner-socket
      - /run/easel/provisioner.sock
      - --gateway-required
      - --egress-proxy
      - http://egress:8899
      - --egress-policy
      - /keys/egress-policy.json
      - --egress-ca-file
      - /keys/egress-ca.pem
    environment:
      SSL_CERT_FILE: /keys/egress-ca.pem
    ports:
      - "127.0.0.1:${EASEL_CONTROL_PORT:-7861}:7861"
    networks:
      - control
    volumes:
      - control:/srv/easel/control
      - keys:/keys:ro
      - ${EASEL_PROVISIONER_SOCKET:?provisioner Unix socket}:/run/easel/provisioner.sock:ro
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:7861/api/health', timeout=3).read()
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s
    restart: unless-stopped
    stop_grace_period: 20s

  egress:
    image: ${EASEL_CONTROL_IMAGE:?请设置固定 control 镜像 ID}
    pull_policy: never
    user: "10001:10001"
    init: true
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=32m
    command:
      - python
      - deploy/multiuser/egress_proxy.py
      - --listen
      - 0.0.0.0
      - --port
      - "8899"
      - --policy
      - /policy/egress-policy.json
    networks:
      control:
        aliases:
          - egress
    volumes:
      # 出口代理只获得专用策略卷，绝不挂 control key 卷；master key 与
      # Ed25519 私钥只存在于 control 进程可见的 keys 卷。
      - egress:/policy:ro
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import socket; socket.create_connection(('127.0.0.1',8899), timeout=2).close()
      interval: 5s
      timeout: 5s
      retries: 6
      start_period: 5s
    restart: unless-stopped
    stop_grace_period: 10s

networks:
  control:
    external: true
    name: ${EASEL_CONTROL_NETWORK:?请设置专用控制网络}

volumes:
  control:
    external: true
    name: ${EASEL_CONTROL_VOLUME:?请设置 control 数据卷}
  keys:
    external: true
    name: ${EASEL_KEY_VOLUME:?请设置 key 卷}
  egress:
    external: true
    name: ${EASEL_EGRESS_VOLUME:?请设置出口策略卷}
